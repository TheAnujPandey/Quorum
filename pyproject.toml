[project]
name = "quorum"
version = "0.1.0"
description = "Agentic RAG platform for CSV, Excel, PDF, and TXT uploads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.120.0",
    "uvicorn[standard]>=0.32.0,<0.35.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "qdrant-client>=1.12.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "aioboto3>=13.2.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4",
    "polars>=1.17.0",
    "fastexcel>=0.11.0",
    "sentence-transformers>=3.3.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-experimental>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langgraph>=0.2.0,<0.3.0",
    "openai>=1.57.0,<2.0.0",
    "python-multipart>=0.0.17",
    "httpx>=0.28.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "backend", "worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
