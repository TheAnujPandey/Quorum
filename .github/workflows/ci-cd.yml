name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --dev
      - run: uv run ruff check api backend worker tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --dev
      - run: uv run python -m pytest tests -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build base image
        run: docker build -t quorum-base -f Dockerfile.base .

      - name: Build API image
        run: docker build -t quorum-api -f Dockerfile.api .

      - name: Build worker image
        run: docker build -t quorum-worker -f Dockerfile.worker .

      - name: Build frontend image
        run: docker build -t quorum-frontend -f frontend/Dockerfile frontend/

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker build -t quorum-base -f Dockerfile.base .
          docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          docker compose logs api
          exit 1

      - name: Smoke test health endpoint
        run: curl -sf http://localhost:8000/health | python3 -m json.tool

      - name: Cleanup
        if: always()
        run: docker compose down -v
